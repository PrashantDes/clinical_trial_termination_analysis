<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Clinical trial analysis flow</title>
  <desc id="desc">606,820 registered studies were reduced to 289,595 completed or terminated interventional trials. Of these, 29,925 were terminated and 225,963 were used in the logistic regression.</desc>
  <rect width="1200" height="250" fill="#ffffff"/>
  <text x="600" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Analysis sample</text>
  <g font-family="Arial, sans-serif" fill="#1f2937">
    <rect x="30" y="80" width="220" height="105" rx="12" fill="#e8f0fe" stroke="#4c72b0" stroke-width="2"/>
    <text x="140" y="120" text-anchor="middle" font-size="27" font-weight="700">606,820</text><text x="140" y="150" text-anchor="middle" font-size="16">registered studies</text>
    <path d="M270 132 H330" stroke="#6b7280" stroke-width="3"/><path d="M330 132 l-12 -8 v16 z" fill="#6b7280"/>
    <rect x="350" y="80" width="220" height="105" rx="12" fill="#eaf7f0" stroke="#55a868" stroke-width="2"/>
    <text x="460" y="120" text-anchor="middle" font-size="27" font-weight="700">289,595</text><text x="460" y="150" text-anchor="middle" font-size="16">eligible interventional trials</text>
    <path d="M590 132 H650" stroke="#6b7280" stroke-width="3"/><path d="M650 132 l-12 -8 v16 z" fill="#6b7280"/>
    <rect x="670" y="80" width="220" height="105" rx="12" fill="#fdf0e6" stroke="#dd8452" stroke-width="2"/>
    <text x="780" y="120" text-anchor="middle" font-size="27" font-weight="700">29,925</text><text x="780" y="150" text-anchor="middle" font-size="16">terminated trials (10.3%)</text>
    <path d="M910 132 H970" stroke="#6b7280" stroke-width="3"/><path d="M970 132 l-12 -8 v16 z" fill="#6b7280"/>
    <rect x="990" y="80" width="180" height="105" rx="12" fill="#f3e8ff" stroke="#8172b2" stroke-width="2"/>
    <text x="1080" y="120" text-anchor="middle" font-size="27" font-weight="700">225,963</text><text x="1080" y="150" text-anchor="middle" font-size="16">regression sample</text>
  </g>
  <text x="600" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Eligible: interventional studies with status COMPLETED or TERMINATED. The regression excludes records outside 2005–2022 and records missing an arm count.</text>
</svg>
